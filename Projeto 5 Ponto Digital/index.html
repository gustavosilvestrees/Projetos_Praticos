<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Ponto de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-dark">
    <header> <!-- Cabeçalho -->
        <div class="logo">Study<span>Flow</span></div>
        <div id="current-time">00:00:00</div>
        <div class="status-container">
            <span id="status-dot"></span>
            <span id="status-text">Disponível <div id="bolinha"></div></span>
        </div>
    </header>

    <main class="container">
        <section class="timer-card">
            <h2>Tempo de Estudo</h2>
            <div id="display-timer">00:00:00</div>

            <div class="actions">
                <button id="btn-action" class="btn-start">Iniciar Estudo</button>
            </div>

            <div id="input-area" class="hidden">
    <textarea id="study-notes" placeholder="O que você aprendeu hoje?"></textarea>
    <button id="btn-save" class="btn-start">Salvar Registro</button> 
</div>
        </section>

        <section class="history-container">

            <div class="history-header">
                <h3>Meus Registros</h3>
                <button id="btn-export" class="btn-secondary">Exportar PDF</button>
                <button id="btn-clear" class="btn-clear">Limpar Tudo</button>
            </div>

            <table id="history-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Total</th>
                        <th>Resumo</th>
                    </tr>
                </thead>
                <tbody id="history-list">
                </tbody>
            </table>
        </section>
    </main>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
