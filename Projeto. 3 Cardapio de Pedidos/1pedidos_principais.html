<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Pedidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="superior"> <!-- Navegaçao Superior -->
        <div class="esquerda">
            <div class="logo">Logo</div>
            <div class="pesquisa">
                <input type="text" placeholder="Pesquisar...">
            </div>
            <div class="compartilhar">Compartilhar</div>
        </div>
    </header>

    <main class="principal"> <!-- Banner Principal -->
        <div class="banner-container">
            <div class="banner">
                <img src="banner.jpg" alt="Banner da Loja">
            </div>
        </div>

        <nav class="navegacao"> <!-- Titulo da Loja -->
            <div class="simbolo">Logo</div>
            <div class="nome">Nome da Loja</div>
            <div class="estrelas">★★★★★</div>
        </nav>



        

        <section class="cardapio">  <!-- Cardapio -->
            <div class="item">
                <div class="imagem">Imagem 1</div>
                <div class="texto">Item 1
                    <div class="legendaImg">Legenda1</div>
                </div>
            </div>
            <div class="item">
                <div class="imagem">Imagem 2</div>
                <div class="texto">Item 2</div>
            </div>
            <div class="item">
                <div class="imagem">Imagem 3</div>
                <div class="texto">Item 3</div>
            </div>
            <div class="item">
                <div class="imagem">Imagem 4</div>
                <div class="texto">Item 4</div>
            </div>
            <div class="item">
                <div class="imagem">Imagem 5</div>
                <div class="texto">Item 5</div>
            </div>
            <div class="item">
                <div class="imagem">Imagem 6</div>
                <div class="texto">Item 6</div>
            </div>
        </section>
    </main>

    <footer class="inferior"> <!-- Botoes Inferiores -->
        <button class="botao"> Início</button>
        <button class="botao"> Pedidos</button>
        <button class="botao"> Carrinho</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
