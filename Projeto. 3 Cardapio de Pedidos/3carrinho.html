<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="icones/fontawesome/css/all.css" rel="stylesheet">
    <link rel="shortcut icon" href="icones/favicons/pizza1.png" type="image/x-icon">
    <title>Minha Sacola - Trattoria Pizzaria</title> </head>

<body>
    <header class="superior"> <div class="esquerda">
            <div class="logo"></div>
            <p class="nome-restaurante-header">Trattoria Pizzaria </p>
            <div class="pesquisa">
                <input type="text" placeholder="Pesquisar...">
            </div>
            <div class="compartilhar"><i class="fa-solid fa-square-share-nodes"></i></div>
        </div>
    </header>

    <main class="principal-sacola"> <div class="titulo-sacola-container"> <p class="tituloMenu">SACOLA</p>
            <div class="close-sacola"><i class="fa-solid fa-xmark"></i></div> </div>

        <section class="itens-sacola"> <div class="item-sacola">
                <div class="item-sacola-img">
                    <img src="cardapio/1calabresa.png" alt="Pizza de Calabresa">
                </div>
                <div class="item-info">
                    <p class="item-nome">Pizza de Calabresa</p>
                    <p class="item-preco">R$ 55,00</p> <div class="item-quantidade-controle">
                        <button class="btn-quantidade-diminuir">-</button>
                        <input type="number" value="1" min="1" class="item-quantidade"> <button class="btn-quantidade-aumentar">+</button>
                    </div>
                </div>
                <div class="item-lixeira" data-item-id="pizza-calabresa"><i class="fa-solid fa-trash-can"></i></div> </div>

            <div class="item-sacola">
                <div class="item-sacola-img">
                    <img src="cardapio/7bacon_e_mussarela.png" alt="Pizza Bacon e Mussarela">
                </div>
                <div class="item-info">
                    <p class="item-nome">Pizza Bacon e Mussarela</p>
                    <p class="item-preco">R$ 62,50</p>
                    <div class="item-quantidade-controle">
                        <button class="btn-quantidade-diminuir">-</button>
                        <input type="number" value="2" min="1" class="item-quantidade">
                        <button class="btn-quantidade-aumentar">+</button>
                    </div>
                </div>
                <div class="item-lixeira" data-item-id="pizza-bacon"><i class="fa-solid fa-trash-can"></i></div>
            </div>

            <div class="sacola-vazia-mensagem" style="display: none;">
                <p>Sua sacola está vazia. Adicione algumas pizzas deliciosas!</p>
                <button class="btn-voltar-cardapio">Voltar ao Cardápio</button>
            </div>

        </section>

        <section class="resumo-pedido"> <div class="resumo-alinhamento"> <p class="resumo-subtotal">Subtotal: <span>R$ 0,00</span></p> <p class="resumo-entrega">Taxa de Entrega: <span>R$ 10,00</span></p>
                <p class="resumo-total">Total: <span class="special3">R$ 0,00</span></p>
            </div>
            <button class="btn-finalizar-pedido">FINALIZAR PEDIDO</button> </section>

    </main>

    <footer class="inferior"> <!-- Botoes Inferiores -->
        <a href="1pedidos_principais.html">
            <div class="alinhamentoDiv">
                <button class="botao">Início</button>
                <div class="iconesInferior"><i class="fa-solid fa-house"></i></div>
            </div>
        </a>

        
            <div class="alinhamentoDiv">
            <button class="botao">Pedidos</button>
        <div class="iconesInferior"><i class="fa-regular fa-note-sticky"></i></div>
        </div>

        <a href="3carrinho.html">
        <div class="alinhamentoDiv">
            <button class="botao"> Carrinho</button>
            <div class="iconesInferior"><i class="fa-solid fa-cart-shopping"></i></div>
        </div>
        </a>
    </footer>

    <script src="script.js"></script>
</body>

</html>
